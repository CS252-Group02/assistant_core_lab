[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-core"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<0.116",
    "httpx>=0.28,<0.29",
    "uvicorn>=0.30,<0.31",
    "sqlmodel>=0.0.22,<0.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.6.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "practice"]
testpaths = ["tests", "practice"]

[tool.ruff]
line-length = 120
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
